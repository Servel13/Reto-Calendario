<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestro Reto Fitness 💙💖</title>

  <!-- Firebase SDK (compatibilidad con navegadores sin módulos) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f7f7fb;
      --card: rgba(255, 255, 255, 0.9);
      --text: #252535;
      --muted: #77778a;
      --border: rgba(132, 132, 160, 0.18);
      --shadow: 0 14px 35px rgba(36, 36, 60, 0.10);
      --blue: #2f80ed;
      --pink: #ec4899;
      --green: #22c55e;
      --red: #ef4444;
    }

    body.dark {
      --bg: #11131a;
      --card: rgba(30, 32, 42, 0.92);
      --text: #f6f6fb;
      --muted: #aaaabe;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(47, 128, 237, 0.16), transparent 32%),
        radial-gradient(circle at top right, rgba(236, 72, 153, 0.15), transparent 30%),
        var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      width: min(1120px, calc(100% - 24px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title-card {
      flex: 1;
      text-align: left;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title-card h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.1;
    }

    .title-card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .toggle-dark {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 16px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 20px;
    }

    .month-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
    }

    .month-nav button,
    .reset-btn {
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      background: #2f3240;
      color: white;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .month-nav button:hover,
    .reset-btn:hover { transform: translateY(-1px); opacity: 0.92; }

    .month-name {
      min-width: 180px;
      padding: 11px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      font-weight: 800;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .person-card {
      padding: 16px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: left;
      overflow: hidden;
    }

    .person-card h2 {
      margin: 0 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 21px;
    }

    .badge {
      font-size: 13px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 99px;
      background: rgba(47, 128, 237, 0.12);
      color: var(--blue);
    }

    .person-card.pink .badge {
      background: rgba(236, 72, 153, 0.12);
      color: var(--pink);
    }

    .progress-bar {
      height: 12px;
      background: rgba(128, 128, 150, 0.16);
      border-radius: 99px;
      overflow: hidden;
      margin: 12px 0 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #67a8ff);
      transition: width 0.35s ease;
    }

    .person-card.pink .progress-fill {
      background: linear-gradient(90deg, var(--pink), #fb8cc6);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .stat {
      padding: 9px 6px;
      border-radius: 14px;
      background: rgba(128, 128, 150, 0.10);
      text-align: center;
      font-size: 13px;
    }

    .stat b {
      display: block;
      margin-top: 3px;
      font-size: 17px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .weekday {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      padding: 3px 0;
    }

    .day {
      min-height: 170px;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day.empty {
      visibility: hidden;
      box-shadow: none;
    }

    .day.completed-b { outline: 2px solid rgba(47, 128, 237, 0.25); }
    .day.completed-g { outline: 2px solid rgba(236, 72, 153, 0.25); }

    .day-number {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      color: var(--muted);
      font-size: 13px;
    }

    .today-pill {
      display: none;
      padding: 3px 7px;
      border-radius: 99px;
      background: rgba(34, 197, 94, 0.14);
      color: var(--green);
      font-size: 11px;
    }

    .day.today .today-pill { display: inline-block; }

    .person-row {
      border-radius: 16px;
      padding: 7px;
      background: rgba(128, 128, 150, 0.08);
    }

    .row-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .done-label { opacity: 0; color: var(--green); transition: opacity 0.2s ease; }
    .person-row.done .done-label { opacity: 1; }

    .icons {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      font-size: 20px;
    }

    .icons span {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      user-select: none;
    }

    .icons span:hover { transform: scale(1.18); }
    .icons span:active { transform: scale(0.95); }

    .active-blue { background: rgba(47, 128, 237, 0.20); box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.18); }
    .active-pink { background: rgba(236, 72, 153, 0.20); box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.18); }
    .active-soda { background: rgba(239, 68, 68, 0.18); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16); }

    .note-btn {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      font-size: 12px;
    }

    .note-btn.has-note {
      color: var(--text);
      background: rgba(255, 193, 7, 0.14);
    }

    .footer-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .reset-btn { background: var(--red); }

    @media (max-width: 820px) {
      .summary-grid { grid-template-columns: 1fr; }
      .calendar { grid-template-columns: repeat(2, 1fr); }
      .weekday { display: none; }
      .day.empty { display: none; }
      .stats { grid-template-columns: repeat(5, minmax(50px, 1fr)); }
    }

    @media (max-width: 470px) {
      .app { width: min(100% - 14px, 1120px); padding-top: 10px; }
      .topbar { align-items: stretch; }
      .title-card { padding: 14px; border-radius: 20px; }
      .toggle-dark { width: 44px; height: 44px; }
      .calendar { grid-template-columns: 1fr; }
      .day { min-height: auto; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .month-name { min-width: 140px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div class="title-card">
        <h1>Nuestro Reto Fitness 💙💖</h1>
        <p>Marquen ejercicio, comida, agua y soda. El objetivo es motivarse, no castigarse.</p>
      </div>
      <button id="toggleDark" class="toggle-dark" title="Cambiar modo">🌙</button>
    </section>

    <section class="month-nav">
      <button id="prev">⬅️</button>
      <span id="monthName" class="month-name"></span>
      <button id="next">➡️</button>
    </section>

    <section class="summary-grid">
      <article class="person-card blue">
        <h2>💙 Servel <span id="b-percent" class="badge">0%</span></h2>
        <div class="progress-bar"><div id="b-progress" class="progress-fill"></div></div>
        <div class="stats">
          <div class="stat">🏃‍♂️<b id="b-ex">0</b></div>
          <div class="stat">🍽️<b id="b-food">0</b></div>
          <div class="stat">💧<b id="b-water">0</b></div>
          <div class="stat">🥤<b id="b-soda">0</b></div>
          <div class="stat">🔥 Racha<b id="b-streak">0</b></div>
        </div>
      </article>

      <article class="person-card pink">
        <h2>💖 Carmen <span id="g-percent" class="badge">0%</span></h2>
        <div class="progress-bar"><div id="g-progress" class="progress-fill"></div></div>
        <div class="stats">
          <div class="stat">🏃‍♀️<b id="g-ex">0</b></div>
          <div class="stat">🍽️<b id="g-food">0</b></div>
          <div class="stat">💧<b id="g-water">0</b></div>
          <div class="stat">🥤<b id="g-soda">0</b></div>
          <div class="stat">🔥 Racha<b id="g-streak">0</b></div>
        </div>
      </article>
    </section>

    <section id="calendar" class="calendar"></section>

    <div class="footer-actions">
      <button id="resetMonth" class="reset-btn">🗑️ Reiniciar mes</button>
    </div>
  </main>

  <script>
    // Inicializar Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAuq6Dm4P989aa_63PFcCYHPVpsF7gnpiA",
      authDomain: "reto-calendario.firebaseapp.com",
      projectId: "reto-calendario",
      storageBucket: "reto-calendario.appspot.com",
      messagingSenderId: "1012712540953",
      appId: "1:1012712540953:web:c329e1b5f002a6a7e2d388",
      measurementId: "G-928B2T1JRG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const people = {
      b: { name: "Servel", colorClass: "active-blue", run: "🏃‍♂️" },
      g: { name: "Carmen", colorClass: "active-pink", run: "🏃‍♀️" }
    };

    const habits = ["exercise", "food", "water", "soda"];
    const habitIcons = { exercise: "🏃", food: "🍽️", water: "💧", soda: "🥤" };
    const weekdays = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    const calendar = document.getElementById("calendar");
    const monthName = document.getElementById("monthName");

    function monthKey() {
      return `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
    }

    function daysInMonth() {
      return new Date(currentYear, currentMonth + 1, 0).getDate();
    }

    function firstWeekday() {
      return new Date(currentYear, currentMonth, 1).getDay();
    }

    function renderCalendar() {
      monthName.textContent = `${monthNames[currentMonth]} ${currentYear}`;
      calendar.innerHTML = "";

      weekdays.forEach((day) => {
        const label = document.createElement("div");
        label.className = "weekday";
        label.textContent = day;
        calendar.appendChild(label);
      });

      for (let i = 0; i < firstWeekday(); i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth(); d++) {
        const div = document.createElement("div");
        const isToday = d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
        div.className = `day ${isToday ? "today" : ""}`;
        div.dataset.day = d;
        div.innerHTML = `
          <div class="day-number"><span>Día ${d}</span><span class="today-pill">Hoy</span></div>
          ${personTemplate("b", d)}
          ${personTemplate("g", d)}
        `;
        calendar.appendChild(div);
      }

      loadProgress();
      addClickHandlers();
    }

    function personTemplate(person, day) {
      const p = people[person];
      return `
        <div class="person-row" data-row-person="${person}" data-row-day="${day}">
          <div class="row-label"><span>${person === "b" ? "💙" : "💖"} ${p.name}</span><span class="done-label">Completo ✅</span></div>
          <div class="icons" data-person="${person}" data-day="${day}">
            <span title="Ejercicio" data-type="exercise">${p.run}</span>
            <span title="Comida" data-type="food">🍽️</span>
            <span title="Agua" data-type="water">💧</span>
            <span title="Soda" data-type="soda">🥤</span>
          </div>
          <button class="note-btn" data-note-person="${person}" data-note-day="${day}">📝 Nota</button>
        </div>
      `;
    }

    function habitPath(person, day, type) {
      return `users/${monthKey()}/${person}/days/${day}/${type}`;
    }

    function notePath(person, day) {
      return `users/${monthKey()}/${person}/days/${day}/note`;
    }

    function monthPath() {
      return `users/${monthKey()}`;
    }

    function addClickHandlers() {
      calendar.querySelectorAll(".icons span").forEach((icon) => {
        icon.addEventListener("click", async () => {
          const parent = icon.parentElement;
          const person = parent.dataset.person;
          const day = parent.dataset.day;
          const type = icon.dataset.type;
          const colorClass = type === "soda" ? "active-soda" : people[person].colorClass;
          const refPath = db.ref(habitPath(person, day, type));
          const snapshot = await refPath.get();
          const isActive = snapshot.exists() && snapshot.val().active;

          if (isActive) {
            icon.classList.remove(colorClass);
            await refPath.remove();
          } else {
            icon.classList.add(colorClass);
            await refPath.set({ active: true, updatedAt: new Date().toISOString() });
          }

          updateCounters();
        });
      });

      calendar.querySelectorAll(".note-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const person = btn.dataset.notePerson;
          const day = btn.dataset.noteDay;
          const refPath = db.ref(notePath(person, day));
          const snapshot = await refPath.get();
          const currentNote = snapshot.exists() ? snapshot.val() : "";
          const newNote = prompt(`Nota para ${people[person].name} - día ${day}:`, currentNote);

          if (newNote === null) return;
          const cleanNote = newNote.trim();
          if (cleanNote) {
            await refPath.set(cleanNote);
            btn.classList.add("has-note");
          } else {
            await refPath.remove();
            btn.classList.remove("has-note");
          }
        });
      });
    }

    async function loadProgress() {
      const snapshot = await db.ref(monthPath()).get();
      const data = snapshot.exists() ? snapshot.val() : {};

      calendar.querySelectorAll(".icons span").forEach((icon) => {
        const parent = icon.parentElement;
        const person = parent.dataset.person;
        const day = parent.dataset.day;
        const type = icon.dataset.type;
        const saved = data?.[person]?.days?.[day]?.[type]?.active;
        const colorClass = type === "soda" ? "active-soda" : people[person].colorClass;
        icon.classList.toggle(colorClass, !!saved);
      });

      calendar.querySelectorAll(".note-btn").forEach((btn) => {
        const person = btn.dataset.notePerson;
        const day = btn.dataset.noteDay;
        const hasNote = !!data?.[person]?.days?.[day]?.note;
        btn.classList.toggle("has-note", hasNote);
      });

      updateUIFromData(data);
    }

    async function updateCounters() {
      const snapshot = await db.ref(monthPath()).get();
      const data = snapshot.exists() ? snapshot.val() : {};
      updateUIFromData(data);
    }

    function updateUIFromData(data) {
      for (const person of ["b", "g"]) {
        const counters = { exercise: 0, food: 0, water: 0, soda: 0 };
        let completedDays = 0;
        let currentStreak = 0;
        let bestStreak = 0;

        for (let day = 1; day <= daysInMonth(); day++) {
          const dayData = data?.[person]?.days?.[day] || {};
          habits.forEach((habit) => {
            if (dayData?.[habit]?.active) counters[habit]++;
          });

          const done = habits.every((habit) => dayData?.[habit]?.active);
          const row = document.querySelector(`[data-row-person="${person}"][data-row-day="${day}"]`);
          if (row) row.classList.toggle("done", done);

          const dayBox = document.querySelector(`.day[data-day="${day}"]`);
          if (dayBox) dayBox.classList.toggle(person === "b" ? "completed-b" : "completed-g", done);

          if (done) {
            completedDays++;
            currentStreak++;
            bestStreak = Math.max(bestStreak, currentStreak);
          } else {
            currentStreak = 0;
          }
        }

        const totalGoals = daysInMonth() * habits.length;
        const totalCompleted = counters.exercise + counters.food + counters.water + counters.soda;
        const percent = Math.round((totalCompleted / totalGoals) * 100);

        document.getElementById(`${person}-ex`).textContent = counters.exercise;
        document.getElementById(`${person}-food`).textContent = counters.food;
        document.getElementById(`${person}-water`).textContent = counters.water;
        document.getElementById(`${person}-soda`).textContent = counters.soda;
        document.getElementById(`${person}-streak`).textContent = bestStreak;
        document.getElementById(`${person}-percent`).textContent = `${percent}%`;
        document.getElementById(`${person}-progress`).style.width = `${percent}%`;
      }
    }

    document.getElementById("prev").addEventListener("click", () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar();
    });

    document.getElementById("next").addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar();
    });

    document.getElementById("resetMonth").addEventListener("click", async () => {
      const ok = confirm(`¿Seguro que quieres borrar todo ${monthNames[currentMonth]} ${currentYear}?`);
      if (!ok) return;
      await db.ref(monthPath()).remove();
      renderCalendar();
    });

    const toggleBtn = document.getElementById("toggleDark");
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark");
      toggleBtn.textContent = "☀️";
    }

    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      toggleBtn.textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("darkMode", isDark);
    });

    renderCalendar();
  </script>
</body>
